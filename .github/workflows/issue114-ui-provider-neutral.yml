name: Issue 114 provider-neutral UI fix

on:
  push:
    branches: [issue-114-exact-price-unavailable]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'mounirabouatmeh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-114-exact-price-unavailable
      - name: Remove provider name from public copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('static-issue23-workflow.js')
          text = p.read_text()
          text = text.replace('AeroDataBox schedule remains valid, but Sabre could not provide an exact fare. Indicative pricing remains available.', 'Cuberence schedule remains valid, but the exact fare could not be provided. Indicative pricing remains available.')
          p.write_text(text)
          PY
          if grep -qi "AeroDataBox" index.html static-app.js static-flow.js static-issue*.js static-issue*.css; then
            echo "Public UI still contains provider-specific AeroDataBox copy"
            exit 1
          fi
          node --check static-issue23-workflow.js
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/issue114-ui-provider-neutral.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep exact-fare coverage copy provider-neutral"
          git push origin HEAD:issue-114-exact-price-unavailable
