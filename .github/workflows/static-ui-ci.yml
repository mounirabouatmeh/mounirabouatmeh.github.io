name: Static UI CI

on:
  pull_request:
    paths:
      - index.html
      - static-app.js
      - static-app.css
      - static-markdown.js
      - static-markdown.css
      - .github/workflows/static-ui-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check static-app.js
          node --check static-markdown.js
      - name: Check required live UI files
        run: |
          test -s index.html
          test -s static-app.css
          test -s static-markdown.js
          test -s static-markdown.css
          grep -q "cuberence-travel-api.vercel.app/api/v1/chat" static-app.js
          grep -q "static-markdown.js" index.html
          grep -q "static-markdown.css" index.html
