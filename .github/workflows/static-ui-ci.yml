name: Static UI CI

on:
  pull_request:
    paths:
      - index.html
      - cuberence-logo-v2.png
      - static-app.js
      - static-app.css
      - static-markdown.js
      - static-markdown.css
      - static-pricing-summary.js
      - static-pricing-summary.css
      - static-flow.js
      - static-flow.css
      - static-sticky-progress.js
      - static-sticky-progress.css
      - static-workspace-enhancements.css
      - static-issue14.js
      - static-issue14.css
      - static-issue16.js
      - static-issue16.css
      - static-issue20.js
      - static-issue20.css
      - static-issue23-state.js
      - static-issue23-workflow.js
      - static-issue23-candidates.js
      - static-issue23-selection.js
      - static-issue23.css
      - static-issue25.js
      - static-issue25.css
      - static-issue30.css
      - static-issue32.css
      - static-welcome-copy.js
      - static-intent-sync.js
      - .github/workflows/static-ui-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check static-app.js
          node --check static-markdown.js
          node --check static-pricing-summary.js
          node --check static-flow.js
          node --check static-sticky-progress.js
          node --check static-issue14.js
          node --check static-issue16.js
          node --check static-issue20.js
          node --check static-issue23-state.js
          node --check static-issue23-workflow.js
          node --check static-issue23-candidates.js
          node --check static-issue23-selection.js
          node --check static-issue25.js
          node --check static-welcome-copy.js
          node --check static-intent-sync.js
      - name: Check required live UI files
        run: |
          test -s index.html
          test -s cuberence-logo-v2.png
          test -s static-app.css
          test -s static-markdown.js
          test -s static-markdown.css
          test -s static-pricing-summary.js
          test -s static-pricing-summary.css
          test -s static-flow.js
          test -s static-flow.css
          test -s static-sticky-progress.css
          test -s static-workspace-enhancements.css
          test -s static-issue14.js
          test -s static-issue14.css
          test -s static-issue16.css
          test -s static-issue20.js
          test -s static-issue20.css
          test -s static-issue23-state.js
          test -s static-issue23-workflow.js
          test -s static-issue23-candidates.js
          test -s static-issue23-selection.js
          test -s static-issue23.css
          test -s static-issue25.js
          test -s static-issue25.css
          test -s static-issue30.css
          test -s static-issue32.css
          test -s static-welcome-copy.js
          test -s static-intent-sync.js
          grep -q "cuberence-travel-api.vercel.app/api/v1/chat" static-app.js
          grep -q "static-markdown.js" index.html
          grep -q "static-pricing-summary.js" index.html
          grep -q "static-flow.js" index.html
          grep -q "static-workspace-enhancements.css" index.html
          grep -q "static-issue14.js" index.html
          grep -q "static-issue14.css" index.html
          grep -q "static-issue16.css" index.html
          grep -q "static-issue20.js" index.html
          grep -q "static-issue20.css" index.html
          grep -q "static-issue23-state.js" index.html
          grep -q "static-issue23-workflow.js" index.html
          grep -q "static-issue23-candidates.js" index.html
          grep -q "static-issue23-selection.js" index.html
          grep -q "static-issue23.css" index.html
          grep -q "static-issue25.js" index.html
          grep -q "static-issue25.css" index.html
          grep -q "static-issue30.css" index.html
          grep -q "static-issue32.css" index.html
          grep -q "leaflet@1.9.4" index.html
          grep -q "static-welcome-copy.js" index.html
          grep -q "baseline-content" index.html
          grep -q 'toolName === "baseline"' static-flow.js
          grep -q "output.baselineId" static-flow.js
          grep -q "prices the cheapest standard trip first, then starts hub discovery" index.html
          grep -q "2026 October 10–15" static-app.js
          grep -q "20–22 nights" static-app.js
          grep -q "pricingNightFilter" static-app.js
          grep -q "renderCandidateDetails" static-app.js
          grep -q "renderDiscoveryMap" static-app.js
          grep -q "confirmed-value" static-workspace-enhancements.css
          grep -q "pricing-filter" static-workspace-enhancements.css
          grep -q "discovery-world-map" static-workspace-enhancements.css
          grep -q "OpenStreetMap contributors" static-issue14.js
          grep -q "All feasible hubs remain visible" static-issue14.js
          grep -q "grid-template-rows: auto auto minmax(0, 1fr) auto" static-issue16.css
          grep -q "Issue #16 owns the sample prompt text and click behavior" static-welcome-copy.js
          if grep -q "SAMPLE_PROMPT\|example.textContent\|input.value" static-welcome-copy.js; then
            echo "static-welcome-copy.js must not write or inject the sample prompt"
            exit 1
          fi
          if grep -q 'class="chat-header"' index.html; then
            echo "Issue #20 requires the oversized chat header to remain removed"
            exit 1
          fi
          grep -q 'id="live-status" hidden' index.html
          grep -q 'id="trip-progress"' index.html
          grep -q 'id="composer-guidance"' index.html
          grep -q 'class="composer-input-row"' index.html
          grep -q 'rows="2"' index.html
          grep -q "max-height: 120px" static-issue20.css
          grep -q "MAX_HEIGHT = 120" static-issue20.js

          # Issue #23 owns the base live workflow and state lifecycle.
          grep -q 'data-stage="intent"' index.html
          grep -q 'data-stage="baseline"' index.html
          grep -q 'data-stage="discovery"' index.html
          grep -q 'data-stage="pricing"' index.html
          grep -q 'data-stage="summary"' index.html
          grep -q 'data-stage="confirmation"' index.html
          grep -q 'data-stage="final"' index.html
          grep -q "Indicative pricing" index.html
          grep -q "Exact flight &amp; fare confirmation" index.html
          grep -q "Final recommendation" index.html
          grep -q 'id="processing-status"' index.html
          grep -q "prefers-reduced-motion" static-issue23.css
          grep -q "issue23-status-cloud" static-issue23.css
          grep -q "pricingStatus" static-issue23-state.js
          grep -q "EXACT_CHECK_PENDING" static-issue23-candidates.js
          grep -q "Confirming the exact selected flights and fare" static-issue23-workflow.js
          grep -q "Final recommendation complete" static-issue23-workflow.js

          # Issue #25: user-gated confirmation, candidate numbers, Luna font controls, approved logo.
          grep -q 'id="luna-font-controls"' index.html
          grep -q 'id="luna-font-decrease"' index.html
          grep -q 'id="luna-font-increase"' index.html
          grep -q "cuberence-luna-font-size" static-issue25.js
          grep -q -- "--luna-response-font-size" static-issue25.css
          grep -q "issue25-candidate-number" static-issue23-candidates.js
          grep -q "candidateNumber" static-issue23-state.js
          grep -q "Select for Luna to confirm pricing" static-issue23-candidates.js
          grep -q "Advisor confirmation authorization: YES" static-issue23-selection.js
          grep -q "confirmationAuthorizedPending" static-issue23-state.js
          grep -q "Waiting for advisor selection" static-issue23-workflow.js
          grep -q "Select candidate" static-issue23-workflow.js
          grep -q 'rel="icon" href="./cuberence-logo-v2.png" type="image/png" sizes="any"' index.html
          grep -q 'class="brand-logo" src="./cuberence-logo-v2.png"' index.html
          grep -q "brand-logo" static-issue25.css
          if grep -q "Select this trip for Luna analysis" static-issue23-candidates.js static-issue23-selection.js; then
            echo "Issue #25 removes candidate-checkbox-driven provisional analysis; confirmation selection must be user-gated after Luna analysis"
            exit 1
          fi

          # Issue #30: current welcome logo and numbered, consolidated workspace.
          grep -q 'welcomeLogo.src = "./cuberence-logo-v2.png"' static-app.js
          grep -q 'class="workspace-stage-number" aria-hidden="true">1</span><span>Trip intent' index.html
          grep -q 'class="workspace-stage-number" aria-hidden="true">3</span><span>Hub discovery &amp; selection' index.html
          grep -q 'class="workspace-stage-number" aria-hidden="true">4</span><span>Indicative pricing' index.html
          grep -q 'class="workspace-stage-number" aria-hidden="true">6</span><span>Exact flight &amp; fare confirmation' index.html
          grep -q 'class="workspace-stage-number" aria-hidden="true">7</span><span>Final recommendation' index.html
          grep -q "welcome-logo" static-issue30.css
          if grep -q 'id="selected-hubs-content"\|<h3>Hub selection</h3>' index.html; then
            echo "Issue #30 requires discovery and selection to share one section without a selected-hubs summary"
            exit 1
          fi
          if grep -q 'welcome.append(createNode("div", "assistant-mark", "C"))' static-app.js; then
            echo "Issue #30 requires the legacy welcome C avatar to remain removed"
            exit 1
          fi

          # Issue #32: provider-neutral discovery, explicit hub gate, carrier cleanup, city-time explanation.
          grep -q "Hub discovery &amp; selection" index.html
          grep -q "flightDesignator" static-app.js
          grep -q "flightDesignator" static-issue23-candidates.js
          grep -q "Usable city time is the estimated time available" static-app.js
          grep -q 's.phases.discovery === "ready"' static-issue23-workflow.js
          grep -q 's.phases.discovery = "complete"' static-issue23-state.js
          grep -q "Select hubs" static-issue23-workflow.js
          if grep -qi "AeroDataBox" index.html static-app.js static-flow.js static-issue*.js static-issue*.css; then
            echo "Issue #32 requires provider-neutral user-facing interface copy"
            exit 1
          fi

          # The old observer-driven tracker/selection runtimes must not compete with the current flow.
          if grep -q '<script src="./static-sticky-progress.js' index.html; then
            echo "Issue #23 requires static-sticky-progress.js to remain out of the live runtime"
            exit 1
          fi
          if grep -q '<script src="./static-issue16.js' index.html; then
            echo "Issue #23 requires static-issue16.js to remain out of the live runtime"
            exit 1
          fi
